<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commited Pasaport — Dijital Ürün Pasaportu</title>
<meta name="description" content="Commited Dijital Ürün Pasaportu (ESPR, AB 2024/1781) — üretici paneli, QR kodlu ürün pasaportları.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --surface-2:#EEF2ED;
  --fg:#15201B; --muted:#5C6B63; --line:#E1E7E1;
  --accent:#0F6E4E; --accent-2:#148A61; --accent-ink:#FFFFFF;
  --public:#0F6E4E; --public-bg:#E4F1EA;
  --authority:#9A6412; --authority-bg:#F6ECD8;
  --internal:#5A6472; --internal-bg:#E9ECF0;
  --danger:#B23B2E;
  --radius:14px; --radius-sm:9px;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#141D18; --surface-2:#1B2620;
  --fg:#E7EDE8; --muted:#97A69D; --line:#243029;
  --accent:#3FBF8E; --accent-2:#51D2A0; --accent-ink:#06120C;
  --public:#4FC996; --public-bg:#143026;
  --authority:#D9A441; --authority-bg:#33280F;
  --internal:#93A0AE; --internal-bg:#1E2630;
  --danger:#E8745F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--mono)}
.wrap{max-width:860px;margin:0 auto;padding-left:16px;padding-right:16px}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:13px;font-family:var(--mono)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.spacer{flex:1}
.btn{font-family:inherit;font-size:14px;font-weight:600;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;font-size:15px}
main{padding-block:22px 64px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.page-h{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:9px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.card .cat{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card .nm{font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.card .br{color:var(--muted);font-size:13px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-top:10px;border-top:1px solid var(--line)}
.slug{font-family:var(--mono);font-size:11px;color:var(--muted)}
.co2{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill.pub,.pill.ok{color:var(--public);background:var(--public-bg)}
.pill.auth{color:var(--authority);background:var(--authority-bg)}
.pill.int{color:var(--internal);background:var(--internal-bg)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:40px 22px;text-align:center;color:var(--muted);margin-top:18px;background:var(--surface)}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;color:var(--muted);margin-top:16px}
.chooser{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.choice{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:18px;cursor:pointer;text-align:left;font-family:inherit;color:var(--fg)}
.choice:hover{border-color:var(--accent)}
.choice.on{border-color:var(--accent);background:var(--public-bg)}
.choice h3{font-size:16px;margin-bottom:4px}
.choice p{margin:0;color:var(--muted);font-size:13px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.section>h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field>label{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.req{color:var(--danger)}
.u{color:var(--muted);font-weight:500;font-size:12px}
.field input[type=text],.field input[type=number],.field input[type=url],.field textarea,.field select,.rep-row input{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);color:var(--fg);width:100%}
.field textarea{resize:vertical;min-height:58px}
.field input:focus,.field textarea:focus,.field select:focus,.rep-row input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.err{color:var(--danger);font-size:12px}
.hint{color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.rep-row{display:flex;gap:8px;margin-bottom:7px}
.rep-row input{min-width:0}
.rep-row .rm{flex:0 0 auto;width:34px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--radius-sm);cursor:pointer}
.add-row{font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;font-weight:600;align-self:flex-start}
.publishbar{position:sticky;bottom:0;z-index:15;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:140px}
.progress .bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.progress small{color:var(--muted);font-size:12px}
.pp-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.pp-hero .main{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.pp-hero h1{font-size:23px;letter-spacing:-.02em}
.pp-hero .br{color:var(--muted);font-weight:500}
.qrbox{background:#fff;border-radius:var(--radius-sm);padding:10px;display:grid;place-items:center}
.qrbox img,.qrbox canvas{display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px}
.fact .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact .v{font-size:18px;font-weight:650;margin-top:3px;font-family:var(--mono);letter-spacing:-.01em}
.pp-sec{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.pp-sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none}
.row .k{color:var(--muted);font-size:13.5px}
.row .v{font-weight:550;text-align:right;overflow-wrap:anywhere}
.certs{display:flex;flex-wrap:wrap;gap:8px}
.cert{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.cert .n{font-family:var(--mono);color:var(--muted);font-weight:500}
.foot-note{margin-top:22px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:8px;font-weight:600}
@media (max-width:480px){.chooser{grid-template-columns:1fr}.page-h{font-size:21px}}

.field input[type=email],.field input[type=password],.search{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);color:var(--fg);width:100%}
.field input[type=email]:focus,.field input[type=password]:focus,.search:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.search{flex:1;min-width:180px;max-width:340px}
.auth-wrap{max-width:440px;margin:10px auto 0}
.auth-side{max-width:440px;margin:18px auto 0;font-size:13.5px}
.form-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.lnk{font-size:13px;color:var(--muted)}
.err:not([hidden]){display:block;margin:4px 0 10px}
.userbar{display:flex;align-items:center;gap:10px}
.userbar .who{font-size:13px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition:none!important}}
@media (max-width:480px){.userbar .who{display:none}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.lang button{font-family:var(--mono);font-size:12px;font-weight:600;border:none;background:var(--surface);color:var(--muted);padding:0 10px;height:34px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.label-panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.label-panel h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.label-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.label-opts button{font-family:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer}
.label-opts button.on{border-color:var(--accent);background:var(--public-bg)}
.label-stage{background:var(--surface-2);border-radius:var(--radius-sm);padding:18px;display:grid;place-items:center;overflow:auto}
.dpp-label{background:#fff;color:#111;border:1px dashed #9aa59f;font-family:var(--sans);display:flex;gap:3mm;align-items:center;padding:2.5mm;box-sizing:border-box}
.dpp-label .lq{flex:0 0 auto;display:grid;place-items:center}
.dpp-label .lq img,.dpp-label .lq canvas{display:block;width:100%!important;height:auto!important}
.dpp-label .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6mm;line-height:1.15}
.dpp-label .l-ey{font-size:5.5pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0F6E4E}
.dpp-label .l-nm{font-weight:700;overflow-wrap:anywhere}
.dpp-label .l-br{color:#444}
.dpp-label .l-co{font-family:var(--mono);font-weight:600;color:#0F6E4E}
.dpp-label .l-sc{color:#333}
.dpp-label .l-hri{font-family:var(--mono);font-size:5pt;color:#111;overflow-wrap:anywhere}
.dpp-label .l-ft{font-size:5pt;color:#666;margin-top:auto}
.dpp-label.s50{width:50mm;height:30mm}.dpp-label.s50 .lq{width:24mm}.dpp-label.s50 .l-nm{font-size:7pt}.dpp-label.s50 .l-br,.dpp-label.s50 .l-co,.dpp-label.s50 .l-sc{font-size:5.5pt}
.dpp-label.s70{width:70mm;height:40mm}.dpp-label.s70 .lq{width:33mm}.dpp-label.s70 .l-nm{font-size:9pt}.dpp-label.s70 .l-br,.dpp-label.s70 .l-co,.dpp-label.s70 .l-sc{font-size:6.5pt}.dpp-label.s70 .l-hri{font-size:6pt}
.dpp-label.s100{width:100mm;height:60mm;padding:4mm;gap:5mm}.dpp-label.s100 .lq{width:50mm}.dpp-label.s100 .l-ey{font-size:7pt}.dpp-label.s100 .l-nm{font-size:13pt}.dpp-label.s100 .l-br,.dpp-label.s100 .l-co,.dpp-label.s100 .l-sc{font-size:8.5pt}.dpp-label.s100 .l-hri{font-size:8pt}.dpp-label.s100 .l-ft{font-size:6pt}
.tbl-wrap{overflow-x:auto;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.tabs button{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.file-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 8px;background:var(--bg);font-size:13px}
.file-row img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:0 0 auto}
.file-row .fi{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700;flex:0 0 auto}
.file-row .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .rm{flex:0 0 auto;width:30px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--radius-sm);cursor:pointer}
.upl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
.upl input{display:none}
.upbar{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:4px}.upbar i{display:block;height:100%;background:var(--accent);width:0}
.en-twin{margin-top:6px}
.en-twin .en-lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:3px}
.en-twin .en-lab b{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.gallery{display:flex;gap:10px;overflow-x:auto;margin-top:16px;padding-bottom:4px}
.gallery img{height:180px;max-width:280px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
.doclist{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;font-size:13.5px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;background:var(--bg);cursor:pointer;font-family:inherit;text-align:left;width:100%}
.doc:hover{border-color:var(--accent)}
.doc .fi{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--danger);border:1px solid currentColor;border-radius:4px;padding:1px 4px}
.dpp-label .lp{flex:0 0 auto;width:22mm;height:22mm;object-fit:cover;border-radius:2mm}
.estpub h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
#estBox h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.jsonbox{width:100%;min-height:220px;font-family:var(--mono);font-size:12px;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);color:var(--fg)}
@media print{
  @page{margin:8mm}
  body.printing{background:#fff!important}
  body.printing *{visibility:hidden}
  body.printing #printArea,body.printing #printArea *{visibility:visible}
  body.printing #printArea{position:absolute;left:0;top:0}
  body.printing .dpp-label{border:.2mm solid #bbb}
}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <div class="brand" onclick="location.hash=''">
    <span class="dot">C</span>
    <span>Commited Pasaport<small id="brandSub">Dijital Ürün Pasaportu</small></span>
  </div>
  <span class="spacer"></span>
  <div class="userbar" id="userbar"></div>
  <div class="lang" role="group" aria-label="Dil / Language"><button id="lTR" onclick="setLang('tr')">TR</button><button id="lEN" onclick="setLang('en')">EN</button></div>
  <button class="theme-btn" id="themeBtn" title="Tema" aria-label="Tema değiştir">◐</button>
</div></div>
<main><div class="wrap" id="app"><div style="padding:60px 0;text-align:center;color:var(--muted)">Yükleniyor…</div></div></main>
<script>
"use strict";
/* ---------- field schema (common + category) ---------- */
var COMMON=[
 {title:"Kimlik",fields:[
   {c:"product_name",l:"Ürün adı",t:"TEXT",r:1,a:"PUBLIC"},
   {c:"brand",l:"Marka",t:"TEXT",r:1,a:"PUBLIC"},
   {c:"sku",l:"Model / SKU",t:"TEXT",r:1,a:"PUBLIC"},
   {c:"gtin",l:"GTIN (barkod)",t:"TEXT",a:"PUBLIC",note:"GS1 Türkiye'den alınan 8, 12, 13 veya 14 haneli numara — kontrol hanesi doğrulanır"},
   {c:"lot",l:"Parti / lot no",t:"TEXT",a:"PUBLIC",note:"Parti düzeyinde pasaport için (GS1 AI 10)"},
   {c:"serial",l:"Seri no",t:"TEXT",a:"PUBLIC",note:"Tekil ürün düzeyinde pasaport için (GS1 AI 21)"},
   {c:"photos",l:"Ürün fotoğrafları",t:"FILES",kind:"image",max:3,a:"PUBLIC",note:"En fazla 3 fotoğraf · JPG, PNG veya WebP · dosya başına 10 MB"},
   {c:"weight_g",l:"Ağırlık",t:"NUMBER",u:"g",a:"PUBLIC"},
   {c:"color",l:"Renk",t:"TEXT",a:"PUBLIC"}]},
 {title:"Menşe",fields:[
   {c:"country_origin",l:"Menşe ülkesi",t:"TEXT",r:1,a:"PUBLIC"},
   {c:"facility",l:"Üretim tesisi",t:"TEXT",r:1,a:"AUTHORITY"}]},
 {title:"Çevresel performans",fields:[
   {c:"carbon",l:"Karbon ayak izi (üretici beyanı)",t:"NUMBER",u:"kgCO₂e / ürün",a:"PUBLIC",note:"Kendi hesapladığınız veya doğrulattığınız değer. Boş bırakırsanız pasaportta Commited ön hesaplaması (tahmini) gösterilir."},

/* ---------- GS1 ---------- */
function gtinDigits(g){return String(g||"").replace(/\D/g,"");}
function gtinValid(g){var d=gtinDigits(g);if([8,12,13,14].indexOf(d.length)<0)return false;
  var sum=0,body=d.slice(0,-1);for(var i=0;i<body.length;i++){sum+=(+body[body.length-1-i])*(i%2===0?3:1);}
  return (10-sum%10)%10===+d[d.length-1];}
function gtin14(g){var d=gtinDigits(g);while(d.length<14)d="0"+d;return d;}
function digitalLink(v){if(!v.gtin||!gtinValid(v.gtin))return null;
  return "https://id.gs1.org/01/"+gtin14(v.gtin)+(v.lot?"/10/"+encodeURIComponent(v.lot):"")+(v.serial?"/21/"+encodeURIComponent(v.serial):"");}
function hri(v){if(!v.gtin||!gtinValid(v.gtin))return "";return "(01) "+gtin14(v.gtin)+(v.lot?" (10) "+v.lot:"")+(v.serial?" (21) "+v.serial:"");}
function granularity(v){return v.serial?"g_item":(v.lot?"g_batch":"g_model");}
function passportUrl(v,id,lang){var q="";if(v.gtin&&gtinValid(v.gtin)){q="?01="+gtin14(v.gtin)+(v.lot?"&10="+encodeURIComponent(v.lot):"")+(v.serial?"&21="+encodeURIComponent(v.serial):"");}
  if(lang==="en"||lang==="tr"){q+=(q?"&":"?")+"l="+lang;}
  return location.origin+location.pathname+q+"#p/"+id;}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function genSlug(){var s="",a="abcdefghijkmnpqrstuvwxyz23456789";for(var i=0;i<10;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
(function(){var t=lsGet("dpp-theme");if(t)document.documentElement.setAttribute("data-theme",t);})();
document.getElementById("themeBtn").onclick=function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  var t=dark?"light":"dark";document.documentElement.setAttribute("data-theme",t);lsSet("dpp-theme",t);
};
function loading(msg){app.innerHTML='<div style="padding:60px 0;text-align:center;color:var(--muted)"><span class="spin"></span> '+esc(msg||"Yükleniyor…")+'</div>';}
function head(title,sub){return '<span class="eyebrow">Commited · DPP</span><h1 class="page-h">'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'');}
function errTr(e){
  var c=(e&&e.code)||"";
  var m={"auth/invalid-email":"Geçersiz e-posta adresi.","auth/email-already-in-use":"Bu e-posta ile zaten bir hesap var. Giriş yapın.",
    "auth/weak-password":"Şifre en az 6 karakter olmalı.","auth/invalid-credential":"Kullanıcı adı/e-posta veya şifre hatalı.",
    "auth/wrong-password":"Kullanıcı adı/e-posta veya şifre hatalı.","auth/user-not-found":"Kullanıcı adı/e-posta veya şifre hatalı.",
    "auth/too-many-requests":"Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar deneyin.","auth/network-request-failed":"Bağlantı hatası. İnternetinizi kontrol edin.",
    "permission-denied":"Bu işlem için yetkiniz yok."};
  return m[c]||("Bir hata oluştu"+(c?" ("+c+")":"")+".");
}
function userbar(){
  var el=document.getElementById("userbar");
  if(!me){el.innerHTML="";return;}
  el.innerHTML=(isAdminEmail()?'<a class="btn sm" href="#admin">Admin</a>':'')+'<span class="who">'+esc((profile&&profile.username)||me.email)+'</span><button class="btn sm" id="logoutBtn">Çıkış</button>';
  document.getElementById("logoutBtn").onclick=function(){auth.signOut().then(function(){location.hash="";});};
}

/* ---------- auth state ---------- */
auth.onAuthStateChanged(function(u){
  me=u;profile=null;
  if(!u){authReady=true;userbar();route();return;}
  fs.collection("users").doc(u.uid).get().then(function(d){profile=d.exists?d.data():null;})
    .catch(function(){}).then(function(){authReady=true;userbar();route();});
});

/* ---------- router ---------- */
window.addEventListener("hashchange",route);
function route(){
  var h=(location.hash||"").replace(/^#/,"");
  window.scrollTo(0,0);
  if(h.indexOf("p/")===0)return renderPublic(h.slice(2));
  if(!authReady)return loading();
  if(!me){return h==="kayit"?renderRegister():(h==="sifre"?renderReset():renderLogin());}
  if(h==="admin")return renderAdmin();
  if(h==="new")return renderWizard(null);
  if(h.indexOf("edit/")===0)return renderWizard(h.slice(5));
  return renderPortal();
}

/* ---------- login / register / reset ---------- */
function authShell(inner){
  return '<div class="auth-wrap">'+inner+'</div>'
   +'<div class="auth-side"><a href="#p/ornek-havlu">Örnek bir pasaportu inceleyin ›</a></div>';
}
function renderLogin(){
  app.innerHTML=authShell(head("Üretici girişi","Ürünlerinize ve pasaportlarınıza erişmek için giriş yapın.")
   +'<form class="section" id="loginForm" novalidate>'
   +'<div class="field"><label for="li_id">Kullanıcı adı veya e-posta</label><input type="text" id="li_id" autocomplete="username" required></div>'
   +'<div class="field"><label for="li_pw">Şifre</label><input type="password" id="li_pw" autocomplete="current-password" required></div>'
   +'<div class="err" id="li_err" hidden></div>'
   +'<div class="form-actions"><button class="btn primary" type="submit" id="li_btn">Giriş yap</button><a href="#sifre" class="lnk">Şifremi unuttum</a></div>'
   +'</form>'
   +'<p class="sub" style="margin-top:14px">Hesabınız yok mu? <a href="#kayit"><b>Ücretsiz kayıt olun</b></a></p>');
  document.getElementById("loginForm").onsubmit=function(ev){
    ev.preventDefault();
    var id=document.getElementById("li_id").value.trim(),pw=document.getElementById("li_pw").value;
    var er=document.getElementById("li_err"),btn=document.getElementById("li_btn");
    er.hidden=true;if(!id||!pw){er.textContent="Lütfen tüm alanları doldurun.";er.hidden=false;return;}
    btn.disabled=true;btn.innerHTML='<span class="spin"></span> Giriş yapılıyor…';
    var emailP=id.indexOf("@")>=0?Promise.resolve(id):fs.collection("usernames").doc(id.toLowerCase()).get().then(function(d){
      if(!d.exists)throw {code:"auth/invalid-credential"};return d.data().email;});
    emailP.then(function(email){return auth.signInWithEmailAndPassword(email,pw);})
      .then(function(){location.hash="";})
      .catch(function(e){er.textContent=errTr(e);er.hidden=false;btn.disabled=false;btn.textContent="Giriş yap";});
  };
}
function renderRegister(){
  app.innerHTML=authShell(head("Üretici kaydı","Hesap oluşturun, ürünleriniz için dijital pasaport yayınlayın.")
   +'<form class="section" id="regForm" novalidate>'
   +'<div class="field"><label for="rg_co">Firma adı <span class="req">*</span></label><input type="text" id="rg_co" autocomplete="organization"></div>'
   +'<div class="field"><label for="rg_un">Kullanıcı adı <span class="req">*</span></label><input type="text" id="rg_un" autocomplete="username"><span class="hint">3–30 karakter; küçük harf, rakam, nokta, tire veya alt çizgi</span></div>'
   +'<div class="field"><label for="rg_em">E-posta <span class="req">*</span></label><input type="email" id="rg_em" autocomplete="email"><span class="hint">Şifre sıfırlama için kullanılır</span></div>'
   +'<div class="field"><label for="rg_pw">Şifre <span class="req">*</span></label><input type="password" id="rg_pw" autocomplete="new-password"><span class="hint">En az 8 karakter</span></div>'
   +'<div class="field"><label for="rg_pw2">Şifre (tekrar) <span class="req">*</span></label><input type="password" id="rg_pw2" autocomplete="new-password"></div>'
   +'<label class="check" style="margin:4px 0 12px"><input type="checkbox" id="rg_kvkk"> <span><a href="https://www.commitedevents.app/aydinlatma-metni" target="_blank" rel="noopener">Aydınlatma Metni</a>\'ni okudum.</span></label>'
   +'<div class="err" id="rg_err" hidden></div>'
   +'<div class="form-actions"><button class="btn primary" type="submit" id="rg_btn">Kayıt ol</button></div>'
   +'</form>'
   +'<p class="sub" style="margin-top:14px">Zaten hesabınız var mı? <a href="#"><b>Giriş yapın</b></a></p>');
  document.getElementById("regForm").onsubmit=function(ev){
    ev.preventDefault();
    var co=val("rg_co"),un=val("rg_un").toLowerCase(),em=val("rg_em"),pw=document.getElementById("rg_pw").value,pw2=document.getElementById("rg_pw2").value;
    var er=document.getElementById("rg_err"),btn=document.getElementById("rg_btn");
    function fail(m){er.textContent=m;er.hidden=false;btn.disabled=false;btn.textContent="Kayıt ol";}
    er.hidden=true;
    if(!co||!un||!em||!pw)return fail("Lütfen zorunlu alanları doldurun.");
    if(!/^[a-z0-9._-]{3,30}$/.test(un))return fail("Kullanıcı adı 3–30 karakter olmalı; yalnızca küçük harf, rakam, nokta, tire, alt çizgi.");
    if(pw.length<8)return fail("Şifre en az 8 karakter olmalı.");
    if(pw!==pw2)return fail("Şifreler eşleşmiyor.");
    if(!document.getElementById("rg_kvkk").checked)return fail("Devam etmek için Aydınlatma Metni'ni onaylayın.");
    btn.disabled=true;btn.innerHTML='<span class="spin"></span> Hesap oluşturuluyor…';
    fs.collection("usernames").doc(un).get().then(function(d){
      if(d.exists)throw {code:"x/username-taken"};
      return auth.createUserWithEmailAndPassword(em,pw);
    }).then(function(cred){
      var uid=cred.user.uid,b=fs.batch();
      b.set(fs.collection("usernames").doc(un),{uid:uid,email:em});
      b.set(fs.collection("users").doc(uid),{username:un,company:co,email:em,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      return b.commit().then(function(){profile={username:un,company:co,email:em};userbar();location.hash="";route();});
    }).catch(function(e){
      if(e&&e.code==="x/username-taken")return fail("Bu kullanıcı adı alınmış, başka bir tane deneyin.");
      fail(errTr(e));
    });
  };
}
function val(id){return document.getElementById(id).value.trim();}
function renderReset(){
  app.innerHTML=authShell(head("Şifre sıfırlama","Kayıtlı e-posta adresinize sıfırlama bağlantısı gönderelim.")
   +'<form class="section" id="rsForm" novalidate>'
   +'<div class="field"><label for="rs_em">E-posta</label><input type="email" id="rs_em" autocomplete="email"></div>'
   +'<div class="err" id="rs_err" hidden></div><div class="hint" id="rs_ok" hidden></div>'
   +'<div class="form-actions"><button class="btn primary" type="submit" id="rs_btn">Bağlantı gönder</button><a href="#" class="lnk">Girişe dön</a></div></form>');
  document.getElementById("rsForm").onsubmit=function(ev){
    ev.preventDefault();var em=val("rs_em"),er=document.getElementById("rs_err"),ok=document.getElementById("rs_ok");
    er.hidden=true;ok.hidden=true;if(!em){er.textContent="E-posta girin.";er.hidden=false;return;}
    auth.languageCode="tr";
    auth.sendPasswordResetEmail(em).then(function(){ok.textContent="Bu adrese kayıtlı bir hesap varsa sıfırlama bağlantısı gönderildi.";ok.hidden=false;})
      .catch(function(e){if(e&&e.code==="auth/user-not-found"){ok.textContent="Bu adrese kayıtlı bir hesap varsa sıfırlama bağlantısı gönderildi.";ok.hidden=false;}else{er.textContent=errTr(e);er.hidden=false;}});
  };
}

/* ---------- portal (my passports) ---------- */
function card(id,p){
  var co=p.values&&p.values.carbon;
  var d=p.updatedAt&&p.updatedAt.toDate?p.updatedAt.toDate():null;
  return '<a class="card" href="#p/'+esc(id)+'">'
    +'<span class="cat">'+esc((CATS[p.category]||{}).label||p.category)+(p.example?' · örnek':'')+'</span>'
    +'<span class="nm">'+esc((p.values&&p.values.product_name)||"(adsız)")+'</span>'
    +'<span class="br">'+esc((p.values&&p.values.brand)||"")+((p.values&&p.values.sku)?' · '+esc(p.values.sku):'')+'</span>'
    +'<span class="foot"><span class="slug">'+(d?d.toLocaleDateString("tr-TR"):'#'+esc(id))+'</span>'
    +(co?'<span class="co2">'+esc(co)+' kgCO₂e</span>':'')+'</span></a>';
}
function renderPortal(){
  var co=(profile&&profile.company)||"";
  app.innerHTML=head("Ürünlerim",(co?co+" · ":"")+"Pasaportlarınızı görüntüleyin, düzenleyin, yenilerini ekleyin.")
   +'<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center"><a class="btn primary" href="#new">+ Yeni pasaport</a>'
   +'<input type="search" id="q" class="search" placeholder="Ürün, marka veya SKU ara…" aria-label="Ara"></div>'
   +'<div id="list"><div class="empty"><span class="spin"></span> Pasaportlar yükleniyor…</div></div>';
  var list=document.getElementById("list"),rows=[];
  function paint(){
    var q=(document.getElementById("q").value||"").toLocaleLowerCase("tr");
    var f=rows.filter(function(r){var v=r.p.values||{};return !q||[v.product_name,v.brand,v.sku].join(" ").toLocaleLowerCase("tr").indexOf(q)>=0;});
    if(!rows.length){list.innerHTML='<div class="empty"><b>Henüz pasaportunuz yok.</b><br>Başlamak için “Yeni pasaport” oluşturun.<br><br><a href="#p/ornek-havlu">Örnek pasaportu inceleyin ›</a></div>';return;}
    if(!f.length){list.innerHTML='<div class="empty">Aramanızla eşleşen ürün yok.</div>';return;}
    list.innerHTML='<div class="sub" style="margin-top:14px">'+f.length+' pasaport</div><div class="grid">'+f.map(function(r){return card(r.id,r.p)}).join("")+'</div>';
  }
  document.getElementById("q").oninput=paint;
  fs.collection("passports").where("ownerUid","==",me.uid).get().then(function(snap){
    rows=snap.docs.map(function(d){return {id:d.id,p:d.data()}});
    rows.sort(function(a,b){return ts(b.p.updatedAt)-ts(a.p.updatedAt)});
    paint();
  }).catch(function(e){list.innerHTML='<div class="notice">Liste yüklenemedi: '+esc(errTr(e))+'</div>';});
}
function ts(t){return t&&t.toMillis?t.toMillis():0;}

/* ---------- wizard (create / edit) ---------- */
var draft=null;
function draftKey(){return "dpp-draft-"+(me?me.uid:"anon");}
function renderWizard(editId){
  if(editId){
    loading("Pasaport yükleniyor…");
    var ref=fs.collection("passports").doc(editId);
    Promise.all([ref.get(),ref.collection("private").doc("authority").get().catch(function(){return null})]).then(function(r){
      if(!r[0].exists||r[0].data().ownerUid!==me.uid){app.innerHTML='<div class="empty">Bu pasaportu düzenleme yetkiniz yok.</div>';return;}
      var p=r[0].data(),pv=(r[1]&&r[1].exists)?(r[1].data().values||{}):{};
      draft={id:editId,pid:editId,category:p.category,values:Object.assign({},p.values||{},pv),createdAt:p.createdAt||null};
      paintWizard();
    }).catch(function(e){app.innerHTML='<div class="notice">Yüklenemedi: '+esc(errTr(e))+'</div>';});
    return;
  }
  draft={id:null,category:null,values:{}};
  try{var d=lsGet(draftKey());if(d){var o=JSON.parse(d);if(o&&!o.id)draft=o;}}catch(e){}
  if(!draft.values)draft.values={};
  if(!draft.pid)draft.pid=genSlug();
  saveDraft();
  paintWizard();
}
function saveDraft(){if(!draft.id)lsSet(draftKey(),JSON.stringify(draft));}
function paintWizard(){
  var editing=!!draft.id;
  var h='<a class="back" href="'+(editing?'#p/'+esc(draft.id):'#')+'">‹ '+(editing?'Pasaporta dön':'Ürünlerime dön')+'</a>'
    +head(editing?"Pasaportu düzenle":"Yeni pasaport",editing?"Değişiklikler kaydedildiğinde aynı QR kod güncel bilgiyi gösterir.":"Ürün kategorisini seçin, verileri girin, yayınlayın.");
  if(!editing){
    h+='<div class="chooser">'
     +'<button class="choice'+(draft.category==="TEXTILE"?" on":"")+'" onclick="pickCat(\'TEXTILE\')"><h3>'+T("cat_TEXTILE")+'</h3><p>'+T("desc_TEXTILE")+'</p></button>'
     +'<button class="choice'+(draft.category==="ELECTRONICS"?" on":"")+'" onclick="pickCat(\'ELECTRONICS\')"><h3>'+T("cat_ELECTRONICS")+'</h3><p>'+T("desc_ELECTRONICS")+'</p></button>'
     +'</div>';
  }
  if(draft.category)h+='<div id="form"></div>';
  app.innerHTML=h;
  if(draft.category)paintForm();
}
window.pickCat=function(c){draft.category=c;saveDraft();paintWizard();};
function badge(a){var m={PUBLIC:["pub",T("a_PUBLIC")],AUTHORITY:["auth",T("a_AUTHORITY")],INTERNAL:["int",T("a_INTERNAL")]}[a]||["int",a];
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>';}
function paintForm(){
  var v=draft.values,html="";
  CATS[draft.category].sections.forEach(function(s){
    html+='<div class="section"><h3>'+esc(SL(s.title))+'</h3>';
    s.fields.forEach(function(f){html+=renderField(f,v[f.c]);});
    html+='</div>';
    if(s.title==="Karbon ön hesaplama girdileri")html+='<div class="section" id="estBox"></div>';
  });
  html+='<div class="publishbar"><div class="progress"><div class="bar"><i id="pbar"></i></div><small id="ptext"></small></div>'
    +'<button class="btn primary" id="pubBtn" onclick="publish()">'+(draft.id?"Değişiklikleri kaydet":"Yayınla ve QR oluştur")+'</button></div>';
  document.getElementById("form").innerHTML=html;
  updateProgress();
}
function renderField(f,val){
  var id="f_"+f.c;
  var lab='<label for="'+id+'">'+esc(FL(f))+(f.r?' <span class="req">*</span>':'')+(f.u?' <span class="u">('+esc(FU(f))+')</span>':'')+' '+badge(f.a)+'</label>';
  var body;
  if(f.t==="BOOL"){
    body='<label class="check"><input type="checkbox" id="'+id+'" '+(val?"checked":"")+' onchange="setVal(\''+f.c+'\',this.checked)"> '+T("yes")+'</label>';
  }else if(f.t==="REP"){
    body='<div id="rep_'+f.c+'">'+repRows(f,val)+'</div><button type="button" class="add-row" onclick="repAdd(\''+f.c+'\')">'+T("add_row")+'</button>';
  }else if(f.t==="LONG"){
    var ev=draft.values[f.c+"_en"];
    body='<textarea id="'+id+'" oninput="setVal(\''+f.c+'\',this.value)">'+esc(val||"")+'</textarea>'
      +'<div class="en-twin"><div class="en-lab"><b>EN</b>'+T("en_twin")+'</div>'
      +'<textarea id="'+id+'_en" lang="en" oninput="setVal(\''+f.c+'_en\',this.value)">'+esc(ev||"")+'</textarea>'
      +'<span class="hint">'+T("en_twin_hint")+'</span></div>';
  }else if(f.t==="SELECT"){
    body='<select id="'+id+'" onchange="setVal(\''+f.c+'\',this.value)"><option value="">'+T("lv_pick")+'</option>'
      +f.opts.map(function(o){return '<option value="'+o+'"'+(val===o?' selected':'')+'>'+esc(T("lv_"+o))+'</option>'}).join("")+'</select>'
      +(f.c==="carbon_level"?'<span class="hint" id="lvWarn" style="color:var(--warn,#b45309)"></span>':'');
  }else if(f.t==="FILES"){
    body='<div class="files" id="files_'+f.c+'">'+fileRows(f,val)+'</div>'
      +'<label class="upl">'+(f.kind==="image"?T("add_photo"):T("add_pdf"))
      +'<input type="file" '+(f.kind==="image"?'accept="image/jpeg,image/png,image/webp"':'accept="application/pdf"')+' multiple onchange="pickFiles(\''+f.c+'\',this)"></label>'
      +'<div id="up_'+f.c+'"></div>';
  }else{
    var typ=f.t==="NUMBER"?"number":(f.t==="URL"?"url":"text");
    body='<input type="'+typ+'" id="'+id+'" value="'+esc(val==null?"":val)+'" oninput="setVal(\''+f.c+'\',this.value)">';
  }
  return '<div class="field" id="field_'+f.c+'">'+lab+body+(f.note?'<span class="hint">'+esc(NL(f.note))+'</span>':'')+'<span class="err" id="err_'+f.c+'" hidden></span></div>';
}
function repRows(f,val){val=val&&val.length?val:[{}];return val.map(function(r,i){return repRow(f,i,r)}).join("");}
function repRow(f,i,row){
  row=row||{};var h='<div class="rep-row">';
  f.sub.forEach(function(sf){
    h+='<input type="'+(sf.t==="NUMBER"?"number":"text")+'" placeholder="'+esc(SUBL(sf.l))+'" aria-label="'+esc(SUBL(sf.l))+'" value="'+esc(row[sf.c]==null?"":row[sf.c])
      +'" oninput="repSet(\''+f.c+'\','+i+',\''+sf.c+'\',this.value)">';
  });
  return h+'<button type="button" class="rm" onclick="repDel(\''+f.c+'\','+i+')" aria-label="'+T("del")+'">×</button></div>';
}
window.setVal=function(c,v){draft.values[c]=v;saveDraft();clearErr(c);updateProgress();};
window.repSet=function(c,i,sc,v){var a=draft.values[c]||[];while(a.length<=i)a.push({});a[i][sc]=v;draft.values[c]=a;saveDraft();clearErr(c);updateProgress();};
window.repAdd=function(c){var f=fieldDef(draft.category,c);var a=draft.values[c]||[{}];if(!a.length)a.push({});a.push({});draft.values[c]=a;
  document.getElementById("rep_"+c).innerHTML=repRows(f,a);saveDraft();};
window.repDel=function(c,i){var f=fieldDef(draft.category,c);var a=draft.values[c]||[];a.splice(i,1);draft.values[c]=a;
  document.getElementById("rep_"+c).innerHTML=repRows(f,a);saveDraft();updateProgress();};
function clearErr(c){var el=document.getElementById("field_"+c);if(el)el.classList.remove("invalid");var e=document.getElementById("err_"+c);if(e)e.hidden=true;}
function filled(f,v){
  if(v==null||v==="")return false;
  if(f.t==="REP")return Array.isArray(v)&&v.some(function(r){return f.sub.some(function(sf){return r&&r[sf.c]!=null&&r[sf.c]!==""})});
  if(f.t==="BOOL")return v===true;
  return true;
}
function updateProgress(){
  var req=fieldsOf(draft.category).filter(function(f){return f.r;});
  var done=req.filter(function(f){return filled(f,draft.values[f.c]);}).length;
  var bar=document.getElementById("pbar"),tx=document.getElementById("ptext");
  if(bar)bar.style.width=(req.length?Math.round(done/req.length*100):100)+"%";
  if(tx)tx.textContent=done+" / "+req.length+" "+T("req_count");
  paintEst();paintLv();
}
function cleanVal(x){
  if(Array.isArray(x)){x=x.filter(function(r){return r&&Object.keys(r).some(function(kk){return r[kk]!=null&&r[kk]!==""})});return x.length?x:undefined;}
  if(x==null||x===""||x===false)return undefined;return x;
}
window.publish=function(){
  var defs=fieldsOf(draft.category);
  var bad=defs.filter(function(f){return f.r&&!filled(f,draft.values[f.c]);});
  if(draft.values.gtin&&!gtinValid(draft.values.gtin))bad.unshift(fieldDef(draft.category,"gtin"));
  if(bad.length){
    bad.forEach(function(f){var el=document.getElementById("field_"+f.c);if(el)el.classList.add("invalid");
      var e=document.getElementById("err_"+f.c);if(e){e.textContent=f.c==="gtin"?T("bad_gtin"):T("required");e.hidden=false;}});
    var first=document.getElementById("field_"+bad[0].c);if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  if(uploadsBusy>0){alert(T("wait_up"));return;}
  var pub={},priv={};

/* ---------- Commited carbon pre-calculation (textile, cradle-to-gate) ---------- */
var EST_VER="CM-TX-1 (2026-10)";
var FIBER_EF=[ // kg CO2e / kg staple fibre; Forfora et al. 2026, Sustainability 18(8):4070, Ecoinvent 3.10
  {k:"cotton",re:/pamuk|cotton/i,ef:2.8},
  {k:"polyester",re:/poly?es[tl]er|poliester|\bpes\b|\bpet\b/i,ef:3.1},
  {k:"lyocell",re:/lyocell|tencel/i,ef:6.1},
  {k:"viscose",re:/vis[kc]o[nsz]|viscose|rayon/i,ef:5.9}];
var EF_ELEC=0.478, EF_GAS=0.202;
var EST_SRC=[
  "Forfora N. et al. (2026) A Comparative Life Cycle Assessment of T-Shirt Production… Sustainability 18(8):4070, doi:10.3390/su18084070 — fibre production factors (Ecoinvent 3.10): cotton 2.8, polyester 3.1, viscose 5.9, lyocell 6.1 kg CO2e/kg",
  "T.C. Enerji ve Tabii Kaynaklar Bakanlığı (2022) Türkiye elektrik tüketim noktası emisyon faktörü — distribution grid 0.478 tCO2e/MWh",
  "IPCC (2006) Guidelines for National GHG Inventories, Vol. 2 Ch. 2 — natural gas 56,100 kg CO2/TJ (≈0.202 kg CO2/kWh)"];
function num(x){var n=parseFloat(String(x==null?"":x).replace(",","."));return isFinite(n)?n:null;}
function estimateCarbon(cat,v){
  if(cat!=="TEXTILE")return null;
  var r={ver:EST_VER,ok:false,issues:[],missingFibres:[],mat:null,elec:null,gas:null,total:null,partial:false};
  var w=num(v.weight_g),rows=(v.fiber_composition||[]).filter(function(x){return x&&(x.fiber||x.pct)});
  if(!w||w<=0)r.issues.push("est_need_w");
  if(!rows.length)r.issues.push("est_need_f");
  var sum=rows.reduce(function(a,x){return a+(num(x.pct)||0)},0);
  if(rows.length&&Math.abs(sum-100)>1)r.issues.push("est_sum");
  var waste=num(v.waste_pct);if(waste==null||waste<0||waste>=90)waste=0;
  var massKg=w?(w/1000)/(1-waste/100):0,mat=0;
  rows.forEach(function(x){var m=FIBER_EF.filter(function(f){return f.re.test(x.fiber||"")})[0];
    if(!m){r.missingFibres.push(x.fiber||"?");return;}
    mat+=(num(x.pct)||0)/100*massKg*m.ef;});
  if(r.missingFibres.length)r.issues.push("est_nofactor");
  if(r.issues.length)return r;
  var ek=num(v.elec_kwh),gk=num(v.gas_kwh);
  var e=(ek!=null&&ek>=0)?ek*EF_ELEC:null,g=(gk!=null&&gk>=0)?gk*EF_GAS:null;
  function rnd(x,d){var p=Math.pow(10,d);return Math.round(x*p+1e-9)/p;}
  r.mat=rnd(mat,3);r.elec=e==null?null:rnd(e,3);r.gas=g==null?null:rnd(g,3);
  r.partial=(e==null&&g==null);
  r.total=rnd(mat+(e||0)+(g||0),2);
  r.ok=true;return r;
}
function fmtKg(n){return (Math.round(n*100)/100).toLocaleString(LANG==="en"?"en-GB":"tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function estHtml(r,showSources){
  if(!r)return "";
  var h='<h3>'+T("est_t")+' <span class="pill auth">'+T("est_tag")+(r.partial?' · '+T("est_partial"):'')+'</span></h3>';
  if(!r.ok){
    h+='<div class="hint">'+T("est_none")+'</div><ul class="hint" style="margin:4px 0 0 18px;padding:0">'
      +r.issues.map(function(k){return '<li>'+T(k)+(k==="est_nofactor"?': '+esc(r.missingFibres.join(", ")):'')+'</li>'}).join("")+'</ul>';
    return h;
  }
  h+='<div class="row"><span class="k">'+T("est_mat")+'</span><span class="v mono">'+fmtKg(r.mat)+' kgCO₂e</span></div>';
  if(r.elec!=null)h+='<div class="row"><span class="k">'+T("est_elec")+'</span><span class="v mono">'+fmtKg(r.elec)+' kgCO₂e</span></div>';
  if(r.gas!=null)h+='<div class="row"><span class="k">'+T("est_gas")+'</span><span class="v mono">'+fmtKg(r.gas)+' kgCO₂e</span></div>';
  h+='<div class="row"><span class="k"><b>'+T("est_total")+'</b></span><span class="v mono"><b>'+fmtKg(r.total)+' kgCO₂e</b></span></div>';
  if(r.partial)h+='<div class="hint" style="margin-top:6px">'+T("est_noenergy")+'</div>';
  h+='<div class="hint" style="margin-top:8px">'+T("est_scope")+' '+T("est_recy")+'</div>'
    +'<div class="hint" style="margin-top:4px"><b>'+T("est_disc")+'</b></div>';
  if(showSources)h+='<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">'+T("est_src")+' · '+esc(r.ver||EST_VER)+'</summary><ol class="hint" style="margin:6px 0 0 18px;padding:0">'
    +EST_SRC.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol></details>';
  return h;
}

window.pickFiles=function(c,input){
  var f=fieldDef(draft.category,c),files=[].slice.call(input.files||[]);input.value="";

      function(){

      });

    +(v.lot?'<div class="row"><span class="k">'+esc(FL(fieldDef(cat,"lot")))+'</span><span class="v mono">'+esc(v.lot)+'</span></div>':'')
    +(v.serial?'<div class="row"><span class="k">'+esc(FL(fieldDef(cat,"serial")))+'</span><span class="v mono">'+esc(v.serial)+'</span></div>':'')
    +'<div class="row"><span class="k">'+T("gran")+'</span><span class="v">'+T(granularity(v))+'</span></div>'
    +(dl?'<div class="row"><span class="k">'+T("dl")+'</span><span class="v mono" style="font-size:12px">'+esc(dl)+'</span></div>':'')
    +'</div>';
  CATS[cat].sections.forEach(function(s){
    var rows=s.fields.filter(function(f){return ["gtin","lot","serial","photos"].indexOf(f.c)<0&&filled(f,v[f.c])&&!(f.t==="FILES"&&!v[f.c].length);});
    if(!rows.length&&!(s.title==="Çevresel performans"&&ce&&ce.total!=null))return;
    if(s.title==="Çevresel performans"){
      h+='<div class="pp-sec"><h3>'+SL(s.title)+'</h3>';
      if(v.carbon)h+='<div class="row"><span class="k">'+T("carbon_t")+' '+lvPill(cl)+'</span><span class="v mono">'+esc(v.carbon)+' kgCO₂e</span></div>'
        +lvLine(cl)
        +(v.carbon_method?'<div class="row"><span class="k">'+T("method")+'</span><span class="v">'+esc(v.carbon_method)+'</span></div>':'')
        +(cl==="verified"&&v.carbon_verifier?'<div class="row"><span class="k">'+T("verifier")+'</span><span class="v">'+esc(v.carbon_verifier)+'</span></div>':'')
        +(cl==="verified"?'<div style="margin-top:8px">'+docList(v.carbon_cert,false)+'</div>':'')
        +'<div class="hint" style="margin-top:6px">'+T("lv_disc")+(cl==="verified"?' '+T("lv_vdisc"):'')+'</div>';
      else if(ce&&ce.total!=null)h+=lvLine("estimate");
      if(ce&&ce.total!=null)h+='<div class="estpub" style="margin-top:'+(v.carbon?'14':'0')+'px">'+estHtml(Object.assign({ok:true,issues:[]},ce),true)+'</div>';
      h+='</div>';return;
    }
    if(s.title==="Sertifikalar"){
      h+='<div class="pp-sec"><h3>'+SL("Sertifikalar")+'</h3><div class="certs">';
      (v.certificates||[]).forEach(function(c){if(!c.type&&!c.number)return;h+='<span class="cert">'+esc(c.type||"Sertifika")+(c.number?' <span class="n">'+esc(c.number)+'</span>':'')+'</span>';});
      h+='</div>'+((v.cert_docs||[]).length?'<div style="margin-top:12px">'+docList(v.cert_docs,false)+'</div>':'')+'</div>';return;
    }
    h+='<div class="pp-sec"><h3>'+esc(SL(s.title))+'</h3>';
    rows.forEach(function(f){
      if(f.t==="FILES"){h+='<div style="margin:6px 0 4px" class="k">'+esc(FL(f))+(f.a==="AUTHORITY"?' '+badge("AUTHORITY"):'')+'</div>'+docList(v[f.c],f.a==="AUTHORITY");return;}
      var val=f.t==="LONG"?txtFor(v,f.c,LANG):fmtVal(f,v[f.c]);
      h+='<div class="row"><span class="k">'+esc(FL(f))+(f.a==="AUTHORITY"?' '+badge("AUTHORITY"):'')+'</span><span class="v">'+esc(val)+'</span></div>';});
    h+='</div>';
  });
  h+='<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">';
  if(priv)h+='<button class="btn sm" onclick="toggleAuth()">'+(showAuth?T("auth_hide"):T("auth_show"))+'</button>';
  h+='<button class="btn sm" id="copyBtn">'+T("copy")+'</button><button class="btn sm" id="dlBtn">'+T("qr_dl")+'</button>'
    +'<button class="btn sm" onclick="toggleLabel()">▦ '+T("label_btn")+'</button>'
    +'<button class="btn sm" onclick="toggleJson()">{ } '+T("jsonld")+'</button>';
  if(owner)h+='<a class="btn sm primary" href="#edit/'+esc(id)+'">'+T("edit")+'</a><button class="btn sm danger" onclick="delP(\''+esc(id)+'\')">'+T("del")+'</button>';
  h+='</div>';
  if(showLabel)h+=labelPanel(v,url);
  if(showJson)h+=jsonPanel(p,v,url);
  if(!priv)h+='<div class="notice">'+T("auth_note")+'</div>';
  var missingEn=fieldsOf(cat).some(function(f){return f.t==="LONG"&&v[f.c]&&!v[f.c+"_en"];});
  h+='<div class="foot-note">'+T("foot")+(LANG==="en"&&missingEn?'<br>'+T("lang_note_en"):'')+'<br>Powered by <b>Commited</b> · '+T("dpp")+'</div>';
  app.innerHTML=h;
  document.getElementById("copyBtn").onclick=function(){
    var b=this;try{navigator.clipboard.writeText(url).then(function(){b.textContent=T("copied");setTimeout(function(){b.textContent=T("copy")},1500)},function(){prompt("Bağlantı:",url)})}catch(e){prompt("Bağlantı:",url)}
  };
  try{new QRCode(document.getElementById("qr"),{text:url,width:150,height:150,colorDark:"#15201B",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}
  catch(e){document.getElementById("qr").innerHTML='<span class="slug">QR oluşturulamadı</span>';}
  document.getElementById("dlBtn").onclick=function(){
    var c=document.querySelector("#qr canvas"),img=document.querySelector("#qr img");
    var src=c?c.toDataURL("image/png"):(img?img.src:null);if(!src)return;
    var a=document.createElement("a");a.href=src;a.download="pasaport-"+id+".png";document.body.appendChild(a);a.click();a.remove();
  };
  if(showLabel){var ll=labelLang||LANG;drawLabelQR(passportUrl(p.values||{},id,ll==="both"?null:ll));}
}
window.toggleAuth=function(){showAuth=!showAuth;route();};
function repaintPublic(){if(lastPub)paintPublic.apply(null,lastPub);}

/* ---------- printable QR label ---------- */
window.toggleLabel=function(){showLabel=!showLabel;repaintPublic();
  if(showLabel){var e=document.getElementById("labelPanel");if(e)e.scrollIntoView({behavior:"smooth",block:"center"});}};
window.setLabelSize=function(s){labelSize=s;repaintPublic();};
window.setLabelLang=function(l){labelLang=l;repaintPublic();};
function lbl(k,ll){return ll==="both"?TL(k,"tr")+' / '+TL(k,"en"):TL(k,ll);}
function labelPanel(v,url){
  var ll=labelLang||LANG;
  var h='<div class="label-panel" id="labelPanel"><h3>'+T("label_t")+'</h3><div class="label-opts">';
  [["s50","50 × 30 mm"],["s70","70 × 40 mm"],["s100","100 × 60 mm"]].forEach(function(z){h+='<button class="'+(labelSize===z[0]?"on":"")+'" onclick="setLabelSize(\''+z[0]+'\')">'+z[1]+'</button>';});
  h+='<span style="flex:1"></span>';
  [["tr","TR"],["en","EN"],["both","TR + EN"]].forEach(function(z){h+='<button class="'+(ll===z[0]?"on":"")+'" onclick="setLabelLang(\''+z[0]+'\')">'+z[1]+'</button>';});
  var ph=(v.photos||[]).filter(function(x){return x.url})[0];
  h+='</div><div class="hint" style="margin:-6px 0 12px">'+T("qr_lang")+': '+(ll==="both"?"TR + EN — "+(LANG==="en"?"follows the phone language":"telefonun diline göre açılır"):(ll==="en"?"EN — "+(LANG==="en"?"always opens in English":"her zaman İngilizce açılır"):"TR — "+(LANG==="en"?"always opens in Turkish":"her zaman Türkçe açılır")))+'</div>'
    +'<div class="label-stage"><div id="printArea"><div class="dpp-label '+labelSize+'">'
    +'<div class="lq" id="labelQR"></div>'+(labelSize==="s100"&&ph?'<img class="lp" src="'+esc(ph.url)+'" alt="">':'')+'<div class="lt">'
    +'<span class="l-ey">'+lbl("dpp",ll)+'</span>'
    +'<span class="l-nm">'+esc(v.product_name||"")+'</span>'
    +'<span class="l-br">'+esc(v.brand||"")+(v.sku?' · '+esc(v.sku):'')+'</span>'
    +(v.carbon?'<span class="l-co">'+esc(v.carbon)+' kgCO₂e</span>':'')
    +(hri(v)?'<span class="l-hri">'+esc(hri(v))+'</span>':'')
    +'<span class="l-sc">'+lbl("scan",ll)+'</span>'
    +'<span class="l-ft">Powered by Commited · ESPR (EU) 2024/1781</span>'
    +'</div></div></div></div>'
    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px">'
    +'<button class="btn primary sm" onclick="printLabel()">⎙ '+T("print")+'</button>'
    +'<span class="hint">'+T("label_hint")+'</span></div></div>';
  return h;
}
function drawLabelQR(url){var el=document.getElementById("labelQR");if(!el)return;
  try{new QRCode(el,{text:url,width:512,height:512,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
window.printLabel=function(){document.body.classList.add("printing");
  setTimeout(function(){window.print();setTimeout(function(){document.body.classList.remove("printing")},300);},60);};
window.addEventListener("afterprint",function(){document.body.classList.remove("printing")});

/* ---------- JSON-LD (public data only) ---------- */
function jsonLd(p,v,url){
  var cat=p.category,props=[];
  fieldsOf(cat).forEach(function(f){if(f.a!=="PUBLIC"||!filled(f,v[f.c]))return;
    if(["product_name","brand","sku","gtin","lot","serial","certificates","country_origin"].indexOf(f.c)>=0)return;
    if(f.t==="FILES")return;
    if(f.c==="carbon"){props.push({"@type":"PropertyValue",propertyID:"carbon_declared",name:"Carbon footprint (company declaration, not verified by Commited)",value:num(v.carbon),unitText:"kg CO2e per product",description:["Basis: "+UI.en["lvs_"+carbonLevel(v)]+" (confidence "+LV_N[carbonLevel(v)]+"/4)",v.carbon_method,carbonLevel(v)==="verified"&&v.carbon_verifier?"Verified by: "+v.carbon_verifier:""].filter(Boolean).join("; ")});return;}
    if(f.c==="carbon_level"||f.c==="carbon_verifier")return;
    props.push({"@type":"PropertyValue",propertyID:f.c,name:EN_F[f.c]||f.l,value:(f.t==="REP"||f.t==="BOOL")?fmtValLang(f,v[f.c],"en"):(f.t==="LONG"?txtFor(v,f.c,"en"):v[f.c]),unitText:f.u?(EN_U[f.u]||f.u):undefined});});
  return {"@context":{"@vocab":"https://schema.org/","gs1":"https://ref.gs1.org/voc/"},
    "@type":"Product","@id":digitalLink(v)||undefined,name:v.product_name,brand:{"@type":"Brand",name:v.brand},
    manufacturer:p.company?{"@type":"Organization",name:p.company}:undefined,
    model:v.sku,gtin:v.gtin&&gtinValid(v.gtin)?gtin14(v.gtin):undefined,"gs1:batchNumber":v.lot||undefined,"gs1:serialNumber":v.serial||undefined,
    countryOfOrigin:v.country_origin,category:cat,
    "gs1:certificationInfo":(v.certificates||[]).filter(function(c){return c.type||c.number}).map(function(c){return{"@type":"gs1:CertificationDetails","gs1:certificationStandard":c.type,"gs1:certificationIdentification":c.number}}),
    image:(v.photos||[]).filter(function(x){return x.url}).map(function(x){return x.url}),
    subjectOf:(v.cert_docs||[]).filter(function(x){return x.url}).map(function(x){return{"@type":"DigitalDocument",name:x.name,url:x.url,encodingFormat:x.type}}),
    additionalProperty:props.concat(v.carbon_est&&v.carbon_est.total!=null?[{"@type":"PropertyValue",propertyID:"carbon_estimate",name:"Carbon footprint (Commited pre-calculation, estimate)",value:v.carbon_est.total,unitText:"kg CO2e per product",description:"Cradle-to-gate estimate ("+v.carbon_est.ver+"); not a verified ISO 14067 footprint"+(v.carbon_est.partial?"; fibre stage only":"")}]:[]),url:url,conformsTo:"ESPR (EU) 2024/1781"};
}
function jsonPanel(p,v,url){
  return '<div class="label-panel" id="jsonPanel"><h3>JSON-LD</h3><textarea class="jsonbox" readonly>'+esc(JSON.stringify(jsonLd(p,v,url),null,2))+'</textarea>'
    +'<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="copyJson(this)">'+T("copy")+'</button>'
    +'<button class="btn sm" onclick="dlJson()">'+T("jsonld_dl")+'</button></div></div>';
}
window.toggleJson=function(){showJson=!showJson;repaintPublic();
  if(showJson){var e=document.getElementById("jsonPanel");if(e)e.scrollIntoView({behavior:"smooth",block:"center"});}};
window.copyJson=function(b){var t=document.querySelector("#jsonPanel textarea");
  try{navigator.clipboard.writeText(t.value).then(function(){b.textContent=T("copied");setTimeout(function(){b.textContent=T("copy")},1500)},function(){t.select()})}catch(e){t.select()}};
window.dlJson=function(){var t=document.querySelector("#jsonPanel textarea");if(!t)return;
  var blob=new Blob([t.value],{type:"application/ld+json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="dpp-"+(curId||"pasaport")+".jsonld";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);};
window.delP=function(id){
  if(!confirm("Bu pasaport kalıcı olarak silinsin mi? QR kodu artık çalışmaz."))return;
  var ref=fs.collection("passports").doc(id);
  try{var all=[].concat((curP&&curP.values&&curP.values.photos)||[],(curP&&curP.values&&curP.values.cert_docs)||[],((lastPub&&lastPub[2])||{}).tech_docs||[]);
    all.forEach(function(x){if(x.path)st.ref(x.path).delete().catch(function(){});});}catch(e){}
  ref.collection("private").doc("authority").delete().catch(function(){}).then(function(){return ref.delete();})
    .then(function(){location.hash="";}).catch(function(e){alert("Silinemedi: "+errTr(e));});
};
function fact(k,v){return '<div class="fact"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}
function fmtVal(f,v){return fmtValLang(f,v,LANG);}
function txtFor(v,c,lang){return (lang==="en"&&v[c+"_en"])?v[c+"_en"]:v[c];}
function fmtValLang(f,v,lang){
  if(f.t==="BOOL")return v?TL("yes",lang):TL("no",lang);
  if(f.t==="REP"){
    if(f.c==="fiber_composition"||f.c==="material_comp")return v.map(function(r){return (r.fiber||r.mat||"")+(r.pct?" %"+r.pct:"");}).filter(Boolean).join(", ");
    return v.map(function(r){return r.name||r.type||Object.values(r).filter(Boolean).join(" ");}).filter(Boolean).join(", ");
  }
  return v+(f.u?" "+(lang==="en"&&EN_U[f.u]?EN_U[f.u]:f.u):"");
}
paintLang();
route();

</script>
</body>
